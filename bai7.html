<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Calculator - ReactJS (Bài 1)</title>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div id="root" class="w-full flex justify-center"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // =========================================================================
    // 1. COMPONENT DISPLAY
    // Hiển thị biểu thức nhập và kết quả tính toán
    // =========================================================================
    function Display({ expression, result, isError }) {
      return (
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl mb-5 text-right shadow-inner min-h-[100px] flex flex-col justify-end">
          {/* Biểu thức đang nhập */}
          <div class="text-slate-400 font-mono text-sm sm:text-base min-h-[24px] overflow-x-auto whitespace-nowrap scrollbar-none mb-1">
            {expression || "0"}
          </div>
          {/* Kết quả xem trước hoặc chốt */}
          <div className={`font-mono text-2xl sm:text-3xl font-bold truncate ${isError ? 'text-rose-400' : 'text-emerald-400'}`}>
            {result !== "" ? result : (expression ? "" : "0")}
          </div>
        </div>
      );
    }

    // =========================================================================
    // 2. COMPONENT BUTTON
    // Nút bấm linh hoạt nhận props label, variant, onClick
    // =========================================================================
    function Button({ label, onClick, variant = "number", className = "" }) {
      const getVariantStyle = () => {
        switch (variant) {
          case "action": // C, DEL, %
            return "bg-slate-800 text-rose-400 hover:bg-slate-700 active:bg-slate-600 border border-slate-700/50";
          case "operator": // +, -, ×, ÷
            return "bg-indigo-600/20 text-indigo-400 hover:bg-indigo-600/40 active:bg-indigo-600 active:text-white border border-indigo-500/30 font-bold";
          case "equal": // =
            return "bg-indigo-600 text-white hover:bg-indigo-500 active:bg-indigo-700 font-bold shadow-lg shadow-indigo-600/30";
          case "number": // 0-9, .
          default:
            return "bg-slate-900 text-slate-100 hover:bg-slate-800 active:bg-slate-700 border border-slate-800/80";
        }
      };

      return (
        <button
          type="button"
          onClick={() => onClick(label)}
          className={`h-14 sm:h-16 rounded-xl text-lg sm:text-xl font-semibold transition-all duration-150 transform active:scale-95 flex items-center justify-center select-none ${getVariantStyle()} ${className}`}
        >
          {label}
        </button>
      );
    }

    // =========================================================================
    // 3. COMPONENT MAIN APP
    // Quản lý State & xử lý Logic
    // =========================================================================
    function App() {
      const [expression, setExpression] = useState("");
      const [result, setResult] = useState("");
      const [isError, setIsError] = useState(false);

      // Hàm tính toán an toàn
      const calculate = (exp) => {
        if (!exp) return "";
        try {
          let sanitized = exp.replace(/×/g, "*").replace(/÷/g, "/");
          sanitized = sanitized.replace(/(\d+(\.\d+)?)%/g, '($1/100)');

          if (/[+\-*/.]$/.test(sanitized)) {
            sanitized = sanitized.slice(0, -1);
          }

          if (!sanitized) return "";

          const evalFunc = new Function(`return (${sanitized})`);
          const res = evalFunc();

          if (isNaN(res) || !isFinite(res)) return "Lỗi";
          return Number.isInteger(res) ? res.toString() : parseFloat(res.toFixed(6)).toString();
        } catch {
          return "Lỗi";
        }
      };

      // Xử lý khi nhấn nút
      const handlePress = (val) => {
        setIsError(false);

        if (val === "C") {
          setExpression("");
          setResult("");
        } else if (val === "DEL") {
          const updated = expression.slice(0, -1);
          setExpression(updated);
          setResult(calculate(updated));
        } else if (val === "=") {
          if (!expression) return;
          const res = calculate(expression);
          if (res === "Lỗi") {
            setIsError(true);
            setResult("Lỗi phép tính");
          } else {
            setExpression(res);
            setResult("");
          }
        } else {
          const operators = ["+", "-", "×", "÷"];
          const lastChar = expression.slice(-1);

          // Tránh 2 toán tử liên tiếp
          if (operators.includes(val) && operators.includes(lastChar)) {
            setExpression(expression.slice(0, -1) + val);
            return;
          }

          // Tránh nhập nhiều dấu chấm (.)
          if (val === ".") {
            const parts = expression.split(/[+\-×÷]/);
            if (parts[parts.length - 1].includes(".")) return;
          }

          const newExp = expression + val;
          setExpression(newExp);

          if (!operators.includes(val)) {
            const preview = calculate(newExp);
            if (preview !== "Lỗi") setResult(preview);
          }
        }
      };

      // Lắng nghe bàn phím
      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.key >= "0" && e.key <= "9") || e.key === ".") handlePress(e.key);
          else if (e.key === "+") handlePress("+");
          else if (e.key === "-") handlePress("-");
          else if (e.key === "*") handlePress("×");
          else if (e.key === "/") handlePress("÷");
          else if (e.key === "%") handlePress("%");
          else if (e.key === "Enter" || e.key === "=") { e.preventDefault(); handlePress("="); }
          else if (e.key === "Backspace") handlePress("DEL");
          else if (e.key === "Escape") handlePress("C");
        };

        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, [expression]);

      // Danh sách phím bấm
      const buttons = [
        [ { label: "C", variant: "action" }, { label: "DEL", variant: "action" }, { label: "%", variant: "action" }, { label: "÷", variant: "operator" } ],
        [ { label: "7", variant: "number" }, { label: "8", variant: "number" }, { label: "9", variant: "number" }, { label: "×", variant: "operator" } ],
        [ { label: "4", variant: "number" }, { label: "5", variant: "number" }, { label: "6", variant: "number" }, { label: "-", variant: "operator" } ],
        [ { label: "1", variant: "number" }, { label: "2", variant: "number" }, { label: "3", variant: "number" }, { label: "+", variant: "operator" } ],
        [ { label: "0", variant: "number" }, { label: ".", variant: "number" }, { label: "=", variant: "equal", className: "col-span-2" } ]
      ];

      return (
        <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl">
          <div class="flex items-center gap-2 mb-4 pb-3 border-b border-slate-800">
            <span class="w-3 h-3 rounded-full bg-rose-500"></span>
            <span class="w-3 h-3 rounded-full bg-amber-500"></span>
            <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
            <h1 class="text-xs font-semibold text-slate-400 uppercase tracking-wider ml-1">Virtual Calculator</h1>
          </div>

          <Display expression={expression} result={result} isError={isError} />

          <div class="grid grid-cols-4 gap-3">
            {buttons.map((row, rIdx) =>
              row.map((btn, bIdx) => (
                <Button
                  key={`${rIdx}-${bIdx}`}
                  label={btn.label}
                  variant={btn.variant}
                  onClick={handlePress}
                  className={btn.className}
                />
              ))
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
